<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jerin J - Resume</title>
    <meta name="description" content="Resume of Jerin J - AI Architect & Full-Stack Engineer">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        .top-bar {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .top-bar h1 {
            color: #ffffff;
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .top-bar span {
            color: #93c5fd;
            font-size: 0.9rem;
            font-weight: 400;
        }

        .btn-group {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
            border: none;
        }

        .btn-primary {
            background: #3b82f6;
            color: white;
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);
        }

        .btn-primary:hover {
            background: #2563eb;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.5);
        }

        .btn-secondary {
            background: rgba(255,255,255,0.08);
            color: #e2e8f0;
            border: 1px solid rgba(255,255,255,0.15);
            backdrop-filter: blur(8px);
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.15);
            transform: translateY(-1px);
        }

        .pdf-wrapper {
            width: 100%;
            max-width: 900px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255,255,255,0.08);
            background: #1e293b;
        }

        iframe {
            width: 100%;
            height: 85vh;
            border: none;
            display: block;
        }

        /* Fallback if iframe doesn't load */
        .fallback {
            display: none;
            text-align: center;
            padding: 4rem 2rem;
            color: #94a3b8;
        }

        .fallback p {
            margin-bottom: 1.5rem;
            font-size: 1rem;
        }

        @media (max-width: 600px) {
            .top-bar {
                flex-direction: column;
                align-items: flex-start;
            }
            iframe {
                height: 75vh;
            }
        }

        @media print {
            body {
                background: white;
                padding: 0;
            }
            .top-bar {
                display: none;
            }
            .pdf-wrapper {
                box-shadow: none;
                border: none;
                border-radius: 0;
                max-width: 100%;
            }
            iframe {
                height: 100vh;
            }
        }
        
        /* ── Scroll Progress Line ── */
        .scroll-progress-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: rgba(59, 130, 246, 0.15);
            z-index: 9999;
        }
        .scroll-progress-line {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #60a5fa, #93c5fd);
            width: 0%;
            border-radius: 0 2px 2px 0;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
            transition: width 0.1s ease-out;
        }
    </style>
</head>
<body>
    <!-- Scroll Progress Line -->
    <div class="scroll-progress-container">
        <div class="scroll-progress-line" id="scrollProgressLine"></div>
    </div>

    <div class="top-bar">
        <div>
            <h1>Jerin J <span>— Resume</span></h1>
        </div>
        <div class="btn-group">
            <a class="btn btn-primary" href="Jerin_J_Resume (1) (1).pdf" download="Jerin_J_Resume.pdf">
                ⬇ Download PDF
            </a>
            <a class="btn btn-secondary" href="index.html">
                ← Back to Portfolio
            </a>
        </div>
    </div>

    <div class="pdf-wrapper">
        <iframe
            src="Jerin_J_Resume (1) (1).pdf"
            title="Jerin J Resume"
            id="resume-frame">
        </iframe>
    </div>

    <script>
        // ── Scroll Progress Line Logic ──
        const scrollProgressLine = document.getElementById('scrollProgressLine');
        if (scrollProgressLine) {
            window.addEventListener('scroll', () => {
                const scrollTotal = document.documentElement.scrollHeight - window.innerHeight;
                const scrollPercentage = scrollTotal > 0 ? (window.scrollY / scrollTotal) * 100 : 0;
                scrollProgressLine.style.width = `${scrollPercentage}%`;
            }, { passive: true });
        }
    </script>
</body>
</html>
